services:
  backend:
    build: ./backend
    container_name: agentworks-backend
    ports:
      - "8700:8700"
    env_file:
      - backend/.env
    environment:
      # data-master MCP + external MCP are reached from inside the container:
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_PROFILE: ${AWS_PROFILE:-}
      VECTOR_DB_URI: /app/data/milvus_lite.db
      DATABASE_URL: sqlite:////app/data/platform.sqlite
    volumes:
      - agentworks-data:/app/data
      - ${HOME}/.aws:/root/.aws:ro     # local SSO/creds for Bedrock (dev)
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8700/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

# Frontend runs separately (frontend/, its own dev server or static build).
# Optional Milvus server / Postgres can be added here if you outgrow milvus-lite/sqlite.

volumes:
  agentworks-data:
